name: Autonomous Multimodal PdM Cloud Sync

on:
  schedule:
    # Runs every 30 minutes in the cloud
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows 1-tap manual trigger anytime from GitHub web or mobile app

jobs:
  cloud_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install python-dotenv

      # =======================================================================
      # Guard: Ensure required secrets are configured in GitHub Actions
      # Fails fast with an informative error if FIREBASE_AUTH is missing,
      # preventing silent sync failures or phantom runs without credentials.
      # =======================================================================
      - name: Verify Required Secrets
        env:
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
        run: |
          if [ -z "$FIREBASE_AUTH" ]; then
            echo "::error::FIREBASE_AUTH secret is not set in GitHub repository secrets. Please configure FIREBASE_AUTH in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Required secrets verified."

      # =======================================================================
      # Step: Autonomous Cloud Sync Execution
      # Synchronizes live and archived wash session telemetry from Firebase RTDB
      # and Samsung SmartThings API without using any hardcoded fallback secrets.
      # =======================================================================
      - name: Execute Autonomous Cloud Sync
        env:
          FIREBASE_HOST: ${{ secrets.FIREBASE_HOST || 'https://pdm-anomaly-detection-default-rtdb.asia-southeast1.firebasedatabase.app' }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
          SMARTTHINGS_REFRESH_TOKEN: ${{ secrets.SMARTTHINGS_REFRESH_TOKEN }}
          SMARTTHINGS_PAT: ${{ secrets.SMARTTHINGS_PAT }}
          SMARTTHINGS_DEVICE_ID: ${{ secrets.SMARTTHINGS_DEVICE_ID }}
        run: |
          python firmware/cloud_multimodal_sync.py --once

      - name: Commit & Push New Wash Datasets and Dashboards
        run: |
          git config --global user.name "Autonomous-PdM-Bot"
          git config --global user.email "bot@pdm-sideproject.local"
          git add data/ index.html dashboard.html cloud_dashboard.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cloud): auto-sync new wash session telemetry" && git push)
